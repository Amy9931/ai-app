<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262b38;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #6c5ce7;
    --accent2: #00b894;
    --user-bubble: #2d3352;
    --ai-bubble: #1c1f2b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .title { font-size: 17px; font-weight: 600; }
  .subtitle { font-size: 12px; color: var(--muted); }
  .new-chat-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  .new-chat-btn:hover { background: var(--border); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .welcome {
    text-align: center;
    margin: auto;
    max-width: 420px;
  }
  .welcome .logo { margin: 0 auto 16px; width: 64px; height: 64px; font-size: 32px; border-radius: 18px; }
  .welcome h1 { font-size: 24px; margin-bottom: 8px; }
  .welcome p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .msg { display: flex; gap: 10px; max-width: 820px; margin: 0 auto; width: 100%; }
  .msg .avatar {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--user-bubble); }
  .msg.ai .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 80%;
  }
  .msg.user .bubble { background: var(--user-bubble); border-top-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .bubble b, .bubble strong { color: #fff; }
  .bubble code {
    background: #00000055;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-family: Consolas, monospace;
  }
  .typing .bubble::after {
    content: "";
    display: inline-block;
    width: 4px; height: 16px;
    background: var(--muted);
    margin-left: 3px;
    vertical-align: middle;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .error .bubble { border-color: #e74c3c88; color: #ff9f9f; }
  form.input-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    max-width: 900px;
    width: calc(100% - 32px);
    margin: 0 auto;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    position: sticky;
    bottom: 12px;
  }
  form.input-bar:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    padding: 8px 4px;
  }
  textarea::placeholder { color: var(--muted); }
  button.send {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #fff;
    width: 42px; height: 42px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 17px;
    flex-shrink: 0;
    transition: transform .1s, opacity .15s;
  }
  button.send:hover { transform: scale(1.05); }
  button.send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .footer { text-align: center; color: var(--muted); font-size: 11px; padding-bottom: 8px; }
  .footer span.ok { color: var(--accent2); }
  .footer span.bad { color: #e74c3c; }
  @media (max-width: 600px) {
    .msg { padding: 0 6px; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🤖</div>
    <div>
      <div class="title">AI Chat</div>
      <div class="subtitle" id="status">Checking status...</div>
    </div>
  </div>
  <button class="new-chat-btn" id="newChat">+ New Chat</button>
</header>

<main id="chat"></main>

<form class="input-bar" id="form">
  <textarea id="input" rows="1" placeholder="Type your message... (Enter = send, Shift+Enter = new line)"></textarea>
  <button type="submit" class="send" id="sendBtn" title="Send">➤</button>
</form>

<div class="footer" id="footer"></div>

<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const newChatBtn = document.getElementById('newChat');

  let history = [];

  function fmt(text) {
    let t = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    t = t.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    return t;
  }

  function addMsg(role, text, extra = '') {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role + ' ' + extra;
    wrap.innerHTML = '<div class="avatar">' + (role === 'user' ? '🙂' : '🤖') + '</div><div class="bubble">' + fmt(text) + '</div>';
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function showWelcome() {
    chatEl.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'welcome';
    w.innerHTML = '<div class="logo">🤖</div><h1>Hello! 👋</h1><p>I am your AI assistant. Ask me anything — type below and press Enter to send. I will reply instantly.</p>';
    chatEl.appendChild(w);
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    autoResize();
    chatEl.querySelector('.welcome')?.remove();
    addMsg('user', text);
    history.push({ role: 'user', text });
    sendBtn.disabled = true;

    const aiWrap = addMsg('ai', '', 'typing');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Server error');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let reply = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.slice(6));
              if (data.type === 'chunk') {
                reply += data.text;
                aiWrap.classList.remove('typing');
                aiWrap.querySelector('.bubble').innerHTML = fmt(reply);
                chatEl.scrollTop = chatEl.scrollHeight;
              } else if (data.type === 'error') {
                throw new Error(data.error);
              }
            } catch (e) { if (e.message !== 'Unexpected end of JSON input') throw e; }
          }
        }
      }
      if (reply) {
        aiWrap.classList.remove('typing');
        aiWrap.querySelector('.bubble').innerHTML = fmt(reply);
        history.push({ role: 'model', text: reply });
      }
    } catch (err) {
      aiWrap.classList.remove('typing');
      aiWrap.classList.add('error');
      aiWrap.querySelector('.bubble').textContent = 'Error: ' + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  form.addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });

  newChatBtn.addEventListener('click', () => {
    history = [];
    showWelcome();
    input.focus();
  });

  async function checkHealth() {
    try {
      const r = await fetch('/api/health');
      const data = await r.json();
      if (data.ai) {
        statusEl.textContent = 'Online • ' + data.model;
        statusEl.style.color = '';
      } else {
        statusEl.textContent = 'API key not set';
        statusEl.style.color = '#e74c3c';
      }
      document.getElementById('footer').innerHTML = data.ai
        ? '<span class="ok">●</span> Gemini connected (' + data.model + ')'
        : '<span class="bad">●</span> GEMINI_API_KEY not found. Create a <b>.env</b> file in the server folder with <code>GEMINI_API_KEY=your-key</code>.';
    } catch (e) {
      statusEl.textContent = 'Cannot connect to server';
      statusEl.style.color = '#e74c3c';
    }
  }

  showWelcome();
  checkHealth();
  input.focus();
</script>
</body>
</html>
